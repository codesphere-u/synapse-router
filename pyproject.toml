[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-router"
version = "1.1.0"
description = "Cost-Aware Multi-Model AI Agent Router, Confidence-Gated Cascade Escalation, Circuit Breaker & Semantic Cache Gateway"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
  { name = "Akandwanaho Ivan Alvin", email = "codesphere-u@users.noreply.github.com" }
]
keywords = [
  "ai-agents",
  "llm-router",
  "model-routing",
  "semantic-cache",
  "circuit-breaker",
  "mcp",
  "cost-optimization",
  "confidence-cascade"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "fastapi>=0.162.2",
    "pydantic>=2.14.3",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "mypy>=1.11.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.8.0",
]

[project.scripts]
synapse-router = "synapse_router.cli:main"

[project.urls]
Homepage = "https://github.com/codesphere-u/synapse-router"
Repository = "https://github.com/codesphere-u/synapse-router"
Issues = "https://github.com/codesphere-u/synapse-router/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
synapse_router = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
explicit_package_bases = true
files = ["src/synapse_router", "api"]

[tool.coverage.run]
source = ["src/synapse_router"]
branch = false

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.vercel]
entrypoint = "api.index:app"
