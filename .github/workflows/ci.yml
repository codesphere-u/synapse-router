name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-benchmark:
    name: Pytest & Benchmark (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run 61-test pytest suite
        run: pytest -v

      - name: Verify 20-step multi-agent workflow demo
        run: python -m synapse_router.cli demo

      - name: Verify 500-request routing benchmark suite
        run: python -m synapse_router.cli benchmark --requests 500
